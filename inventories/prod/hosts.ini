# Production inventory — two app servers behind a load balancer.
# Hostnames below are EXAMPLES (documentation ranges / placeholder names).
# Swap in real inventory data via your CMDB or dynamic inventory in real use.

[app_servers]
prod-app-01 ansible_host=app01.example.internal
prod-app-02 ansible_host=app02.example.internal

[monitoring_targets]
prod-app-01
prod-app-02

[all:vars]
ansible_user=deploy
ansible_python_interpreter=/usr/bin/python3
env_name=prod
