---
# roles/docker/tasks/main.yml

- name: Remove conflicting distribution Docker packages
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages }}"
    state: absent
  when: ansible_facts.os_family == "Debian"

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name: "{{ docker_prereq_packages }}"
    state: present
  when: ansible_facts.os_family == "Debian"

- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the official Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_apt_gpg_url }}"
    dest: "{{ docker_apt_keyring_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Add the official Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "{{ docker_apt_repo_url }}"
    suites: "{{ docker_apt_release }}"
    components: [stable]
    architectures: "{{ docker_apt_arch }}"
    signed_by: "{{ docker_apt_keyring_path }}"
    state: present
    enabled: true
  when: ansible_facts.os_family == "Debian"

- name: Update apt cache after adding the Docker repository
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts.os_family == "Debian"

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name: "{{ docker_ce_packages }}"
    state: present
  when: ansible_facts.os_family == "Debian"
  notify: Restart docker

- name: Ensure the Docker configuration directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template Docker daemon configuration
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: "{{ docker_service_enabled }}"
    state: "{{ docker_service_state }}"

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: docker_users | length > 0
