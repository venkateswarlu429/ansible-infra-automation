---
# roles/monitoring/tasks/main.yml

- name: Create the node_exporter system group
  ansible.builtin.group:
    name: "{{ monitoring_node_exporter_group }}"
    system: true
    state: present
  when: monitoring_node_exporter_enabled | bool

- name: Create the node_exporter system user
  ansible.builtin.user:
    name: "{{ monitoring_node_exporter_user }}"
    group: "{{ monitoring_node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  when: monitoring_node_exporter_enabled | bool

- name: Download the node_exporter release tarball
  ansible.builtin.get_url:
    url: "{{ monitoring_node_exporter_download_url }}"
    dest: "/tmp/{{ monitoring_node_exporter_tarball }}"
    mode: "0644"
    checksum: "{{ monitoring_node_exporter_checksum if monitoring_node_exporter_checksum else omit }}"
  when: monitoring_node_exporter_enabled | bool

- name: Extract node_exporter into /opt
  ansible.builtin.unarchive:
    src: "/tmp/{{ monitoring_node_exporter_tarball }}"
    dest: /opt
    remote_src: true
    creates: "{{ monitoring_node_exporter_install_dir }}/node_exporter"
    owner: root
    group: root
  when: monitoring_node_exporter_enabled | bool

- name: Install the node_exporter binary
  ansible.builtin.copy:
    src: "{{ monitoring_node_exporter_install_dir }}/node_exporter"
    dest: "{{ monitoring_node_exporter_bin }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart node_exporter
  when: monitoring_node_exporter_enabled | bool

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ monitoring_node_exporter_textfile_dir }}"
    state: directory
    owner: "{{ monitoring_node_exporter_user }}"
    group: "{{ monitoring_node_exporter_group }}"
    mode: "0775"
  when: monitoring_node_exporter_enabled | bool

- name: Template the node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart node_exporter
  when: monitoring_node_exporter_enabled | bool

- name: Enable and start node_exporter
  ansible.builtin.service:
    name: node_exporter
    enabled: true
    state: started
  when: monitoring_node_exporter_enabled | bool
