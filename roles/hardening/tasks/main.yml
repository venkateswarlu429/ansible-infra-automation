---
# roles/hardening/tasks/main.yml
# All tasks are variable-driven and idempotent: re-running this role on a
# converged host reports "ok", not "changed".

- name: Render hardened sshd drop-in configuration
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: "{{ hardening_sshd_config_path }}"
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart ssh
  when: hardening_enabled | bool

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  when:
    - ansible_facts.os_family == "Debian"
    - hardening_fail2ban_enabled | bool

- name: Template fail2ban local jail configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
  when: hardening_fail2ban_enabled | bool

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: hardening_fail2ban_enabled | bool

- name: Apply sysctl hardening baseline
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ hardening_sysctl_file }}"
    state: present
    reload: true
  loop: "{{ hardening_sysctl_settings | dict2items }}"
  when: hardening_enabled | bool

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when:
    - ansible_facts.os_family == "Debian"
    - hardening_unattended_upgrades_enabled | bool

- name: Configure unattended-upgrades policy
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  when: hardening_unattended_upgrades_enabled | bool

- name: Enable periodic apt update and unattended upgrade timers
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: hardening_unattended_upgrades_enabled | bool

- name: Ensure apt-daily-upgrade timer is enabled
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    enabled: true
    state: started
    daemon_reload: true
  when: hardening_unattended_upgrades_enabled | bool
