---
# site.yml - top-level entry point for the whole fleet.
#
# Usage:
#   ansible-playbook -i inventories/dev  site.yml --syntax-check
#   ansible-playbook -i inventories/dev  site.yml --check --diff
#   ansible-playbook -i inventories/prod site.yml --ask-vault-pass
#
# Plays are split by concern so a partial run stays predictable:
#   ansible-playbook site.yml --tags hardening
#   ansible-playbook site.yml --tags docker,app

- name: Baseline configuration for all hosts
  hosts: all
  gather_facts: true
  roles:
    - role: common
      tags: [common, baseline]
    - role: hardening
      tags: [hardening, baseline, security]

- name: Container runtime for application hosts
  hosts: app_servers
  gather_facts: true
  roles:
    - role: docker
      tags: [docker, runtime]

- name: Observability agents for all hosts
  hosts: all
  gather_facts: true
  roles:
    - role: monitoring
      tags: [monitoring, observability]

- name: Application deployment
  hosts: app_servers
  gather_facts: false
  roles:
    - role: app_deploy
      tags: [app, deploy]
