name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-syntax:
    name: ansible-lint + syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.16" ansible-lint

      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        run: ansible-lint site.yml roles/

      - name: Syntax-check the site playbook (dev inventory)
        run: ansible-playbook -i inventories/dev/hosts.ini site.yml --syntax-check

      - name: Syntax-check the site playbook (prod inventory)
        run: ansible-playbook -i inventories/prod/hosts.ini site.yml --syntax-check
